apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-security-headers@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Monitoring
    gethomepage.dev/name: Grafana
    gethomepage.dev/icon: si-grafana
    gethomepage.dev/href: https://grafana.omv.mousses.xyz
    gethomepage.dev/description: Dashboards, Explore, and alerting
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.omv.mousses.xyz
      secretName: grafana-tls
  rules:
    - host: grafana.omv.mousses.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
