apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-tools
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  secretName: monitoring-tools-tls
  dnsNames:
    - prometheus.omv.mousses.xyz
    - alertmanager.omv.mousses.xyz
    - loki.omv.mousses.xyz
    - alloy.omv.mousses.xyz
  issuerRef:
    name: letsencrypt-production-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
