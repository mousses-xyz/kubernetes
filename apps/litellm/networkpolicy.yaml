apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/component: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    # k3s does not match pod selectors for traffic that crosses nodes, so a
    # gateway on redqueen needs a literal destination instead. The OMV pod CIDR
    # is stable per node; postgres-0's own address is not.
    - to:
        - ipBlock:
            cidr: 10.42.0.0/24
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.9.20.242/32
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8190
        - protocol: TCP
          port: 8191
---
