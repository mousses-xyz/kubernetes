apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-ingress
  namespace: litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
              app.kubernetes.io/component: migrations
      ports:
        - protocol: TCP
          port: 5432
    # As above: a gateway running on redqueen is invisible to the selectors
    # above, so admit redqueen's pod subnet instead. Reaching this port still
    # requires an egress permission, which today only the gateway holds.
    - from:
        - ipBlock:
            cidr: 10.42.1.0/24
      ports:
        - protocol: TCP
          port: 5432
