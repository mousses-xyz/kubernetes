apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-admin
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: litellm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: LiteLLM Admin
    gethomepage.dev/icon: mdi-api
    gethomepage.dev/href: https://admin.ai.omv.mousses.xyz
    gethomepage.dev/description: Model gateway admin, keys, and usage
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`admin.ai.omv.mousses.xyz`) && PathPrefix(`/fallback/login`)
      middlewares:
        - name: admin-fallback-lan-only
        - name: security-headers
      services:
        - name: litellm
          port: http
    - kind: Rule
      match: Host(`admin.ai.omv.mousses.xyz`) && !PathPrefix(`/fallback/login`)
      middlewares:
        - name: security-headers
      services:
        - name: litellm
          port: http
  tls:
    secretName: litellm-admin-tls
