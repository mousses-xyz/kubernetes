apiVersion: apps/v1
kind: Deployment
metadata:
  name: pds-staging
  namespace: pds-staging
  labels:
    app.kubernetes.io/name: pds-staging
    app.kubernetes.io/part-of: pds-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pds-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pds-staging
        app.kubernetes.io/part-of: pds-staging
        mousses.xyz/public-web-egress: "true"
        mousses.xyz/traefik-http-backend: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pds
          image: ghcr.io/bluesky-social/pds@sha256:20db9d828e9096978a907fe134125cdb26a00417aef6376920204bbfa060ab5c
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pds-staging-env
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: pds-staging-data
              mountPath: /pds
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pds-staging-data
          persistentVolumeClaim:
            claimName: pds-staging-data
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 120
