apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pds-staging
  namespace: pds-staging
  labels:
    app.kubernetes.io/name: pds-staging
    app.kubernetes.io/part-of: pds-staging
spec:
  secretName: pds-staging-tls
  dnsNames:
    - pds-staging.mousses.xyz
    - "*.pds-staging.mousses.xyz"
  issuerRef:
    name: letsencrypt-production-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
