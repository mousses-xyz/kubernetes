apiVersion: v1
kind: PersistentVolume
metadata:
  name: pds-staging-data
  labels:
    app.kubernetes.io/name: pds-staging
    app.kubernetes.io/part-of: pds-staging
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pds-staging-local
  local:
    path: /filesystem/k3s/data/pds-staging
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - openmediavault
