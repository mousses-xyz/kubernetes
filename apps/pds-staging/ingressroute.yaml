apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pds-staging
  namespace: pds-staging
  labels:
    app.kubernetes.io/name: pds-staging
    app.kubernetes.io/part-of: pds-staging
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pds-staging.mousses.xyz`)
      priority: 100
      middlewares:
        - name: security-headers
      services:
        - name: pds-staging
          port: http
    - kind: Rule
      match: "HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\\.pds-staging\\.mousses\\.xyz$`)"
      priority: 50
      middlewares:
        - name: security-headers
      services:
        - name: pds-staging
          port: http
  tls:
    secretName: pds-staging-tls
