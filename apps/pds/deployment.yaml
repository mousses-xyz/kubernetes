apiVersion: apps/v1
kind: Deployment
metadata:
  name: pds
  namespace: pds
  labels:
    app.kubernetes.io/name: pds
    app.kubernetes.io/part-of: pds
spec:
  # Keep the production PDS stopped until /pds has been copied into the PVC.
  # The cutover step scales this to 1.
  replicas: 0
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pds
        app.kubernetes.io/part-of: pds
        mousses.xyz/public-web-egress: "true"
        mousses.xyz/traefik-http-backend: "true"
    spec:
      automountServiceAccountToken: false
      # The Service is named pds. Without this, Kubernetes injects
      # PDS_PORT=tcp://... and the PDS falls back to port 2583.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pds
          # ghcr.io/bluesky-social/pds:0.4, runtime 0.4.5051.
          image: ghcr.io/bluesky-social/pds@sha256:20db9d828e9096978a907fe134125cdb26a00417aef6376920204bbfa060ab5c
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pds-env
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: pds-data
              mountPath: /pds
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pds-data
          persistentVolumeClaim:
            claimName: pds-data
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 120
