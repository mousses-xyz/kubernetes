apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pds-data
  namespace: pds
  labels:
    app.kubernetes.io/name: pds
    app.kubernetes.io/part-of: pds
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: pds-local
  volumeName: pds-data
  resources:
    requests:
      storage: 64Gi
