apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pds-staging
  namespace: pds
  labels:
    app.kubernetes.io/name: pds
    app.kubernetes.io/part-of: pds
spec:
  secretName: pds-tls-staging
  dnsNames:
    - bluesky.mousses.xyz
    - "*.bluesky.mousses.xyz"
  issuerRef:
    name: letsencrypt-staging-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
