apiVersion: v1
kind: PersistentVolume
metadata:
  name: pds-data
  labels:
    app.kubernetes.io/name: pds
    app.kubernetes.io/part-of: pds
spec:
  capacity:
    storage: 64Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pds-local
  local:
    path: /filesystem/k3s/data/pds
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - openmediavault
