apiVersion: apps/v1
kind: Deployment
metadata:
  name: pds-restore-smoke
  namespace: pds
  labels:
    app.kubernetes.io/name: pds-restore-smoke
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/managed-by: nas-backup-migration
    backups.mousses.xyz/restore-isolated: "true"
spec:
  # The restore runner scales this to one only after artifact validation passes.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pds-restore-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pds-restore-smoke
        app.kubernetes.io/part-of: pds
        backups.mousses.xyz/restore-isolated: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pds
          image: ghcr.io/bluesky-social/pds@sha256:20db9d828e9096978a907fe134125cdb26a00417aef6376920204bbfa060ab5c
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pds-restore-env
          env:
            - name: PDS_DATA_DIRECTORY
              value: /pds
            - name: PDS_BLOBSTORE_DISK_LOCATION
              value: /pds/blocks
            - name: PDS_PORT
              value: "3000"
            # The isolated restore must not attempt to contact crawlers even if
            # the saved environment enabled them.
            - name: PDS_CRAWLERS
              value: ""
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Lower reservations than production so the isolated smoke test can
            # run beside the live PDS on the single node.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: pds-data-restored
              mountPath: /pds
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pds-data-restored
          persistentVolumeClaim:
            claimName: data-restore-data
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 120
