---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pds-data-restore-cache
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pds-backup-local
  claimRef:
