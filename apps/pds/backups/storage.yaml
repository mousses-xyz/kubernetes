apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pds-backup-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pds-restic-repositories
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pds-backup-local
  claimRef:
    namespace: pds
    name: restic-repositories
  local:
    path: /filesystem/k3s/data/pds-backups/backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-repositories
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: pds-backup-local
  volumeName: pds-restic-repositories
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pds-data-backup-staging
spec:
  capacity:
    storage: 64Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pds-backup-local
  claimRef:
    namespace: pds
    name: data-backup-staging
  local:
    path: /filesystem/k3s/data/pds-backups/backup-staging/pds-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-backup-staging
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: pds-backup-local
  volumeName: pds-data-backup-staging
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pds-data-backup-cache
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pds-backup-local
  claimRef:
    namespace: pds
    name: volsync-src-data-backup-cache
  local:
    path: /filesystem/k3s/data/pds-backups/backup-cache/pds-data/source
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
